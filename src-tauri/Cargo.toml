[package]
name = "crex-desktop"
version = "1.0.0"
description = "Crex High-Performance Bare-Metal Collaborative IDE"
authors = ["Lead Systems Architect <architect@crux.systems>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "fs-all", "path-all", "process-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tempfile = "3.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
