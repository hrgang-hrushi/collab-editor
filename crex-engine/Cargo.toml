[package]
name = "crex-engine"
version = "0.1.0"
edition = "2021"
description = "Crex bare-metal WebGPU text rendering pipeline and AST-CRDT sync engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
