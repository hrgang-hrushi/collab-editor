[package]
name = "crex-engine"
version = "1.0.0"
edition = "2021"
authors = ["Lead Systems Architect <architect@crux.systems>"]
description = "Crex proprietary WebGPU 120fps rendering engine and semantic AST-CRDT synchronization core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
wgpu = { version = "0.20.0", default-features = false, features = ["webgl", "wgsl"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "Performance",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "Gpu",
    "GpuCanvasContext",
    "GpuDevice",
    "GpuQueue"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
