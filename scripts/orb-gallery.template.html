<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crux — Loading Orb Comparison</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; }
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { margin: 0; background: #000; }
    main { max-width: 1120px; margin: auto; padding: 32px 20px; }
    .page-header { border-bottom: 1px solid #222; padding-bottom: 24px; margin-bottom: 24px; }
    .eyebrow, .selection, .clear-choice, .card-top, .inline-preview, footer { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .eyebrow { color: #fff; }
    h1 { margin: 16px 0 8px; font-size: clamp(28px, 4vw, 48px); letter-spacing: -.04em; }
    p { margin: 0; color: #aaa; font-size: 14px; line-height: 1.5; }
    .selection-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 24px; }
    .selection { display: inline-flex; flex-wrap: wrap; gap: 16px; padding: 10px 12px; border: 1px solid #222; color: #aaa; }
    .selection strong { color: #fff; }
    .clear-choice { padding: 10px 12px; border: 1px solid #222; background: #000; color: #aaa; cursor: pointer; }
    .clear-choice:hover, .clear-choice:focus-visible { border-color: #fff; color: #fff; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #222; border-left: 1px solid #222; }
    .orb-card { min-width: 0; padding: 16px; text-align: left; color: #fff; background: #111; border: 0; border-right: 1px solid #222; border-bottom: 1px solid #222; cursor: pointer; font: inherit; }
    .orb-card:hover, .orb-card:focus-visible { background: #222; outline: 1px solid #fff; outline-offset: -1px; }
    .orb-card[data-selected="true"] { background: #222; outline: 2px solid #fff; outline-offset: -2px; }
    .card-top { display: flex; justify-content: space-between; color: #aaa; }
    .orb-stage { height: 146px; display: flex; align-items: center; justify-content: center; background: #000; border: 1px solid #222; margin: 14px 0; }
    .card-title { text-transform: uppercase; font-size: 20px; font-weight: 700; letter-spacing: .025em; }
    .card-description { min-height: 38px; margin-top: 6px; color: #aaa; font-size: 12px; line-height: 1.45; }
    .inline-preview { display: flex; align-items: center; gap: 12px; height: 40px; margin-top: 12px; padding-top: 8px; border-top: 1px solid #222; color: #aaa; }
    footer { color: #777; border-top: 1px solid #222; margin-top: 24px; padding-top: 16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } main { padding: 20px 12px; } }
  </style>
</head>
<body>
  <div id="orb-gallery"></div>
  <script>/* ORB_GALLERY_BUNDLE */</script>
</body>
</html>
