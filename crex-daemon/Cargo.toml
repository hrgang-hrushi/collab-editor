[package]
name = "crex-daemon"
version = "0.1.0"
edition = "2021"
description = "Crex native local hardware orchestration daemon and workspace configuration parser"

[[bin]]
name = "crex-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
