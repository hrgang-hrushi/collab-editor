[package]
name = "crex-core"
version = "0.1.0"
edition = "2021"
description = "Crex native core engine: Piece Table text buffer, Tree-sitter AST, and C-FFI bridge"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
